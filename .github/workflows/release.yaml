name: Publish Fory

on:
  workflow_dispatch:
  pull_request:
  push:
  release:
    types:
      - published

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-14, windows-2022]  # macos-13: x86, macos-14: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0.0
        with:
            package-dir: python
        env:
          CIBW_BUILD_FRONTEND: pip
          CIBW_SKIP: "*-win32"
          CIBW_BEFORE_ALL_WINDOWS: |
            bash ci/run_ci.sh install_bazel_windows
            bash ci/deploy.sh bump_py_version
          CIBW_BEFORE_ALL: |
            bash ci/run_ci.sh install_bazel
            bash ci/deploy.sh bump_py_version
          CIBW_BEFORE_ALL_LINUX: |
            yum -y install sudo wget
            bash ci/run_ci.sh install_bazel
            bash ci/deploy.sh bump_py_version
          CIBW_BEFORE_BUILD: "pip install pyarrow==15.0.0 Cython wheel pytest"
          # Consider adding a test command for better validation.
          CIBW_TEST_COMMAND: ""

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyfory-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish-wheels:
    name: Publish Wheels
    runs-on: ubuntu-latest
    needs: build-wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Wheel Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: downloaded_wheels/
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R downloaded_wheels
      - name: Publish Wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: downloaded_wheels/
